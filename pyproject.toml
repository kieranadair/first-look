[project]
name = "firstlook"
version = "0.1.0"
description = "Discover, challenge and preserve a first understanding of tabular data."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 110
exclude = [".venv", ".git", "scratch", "dist", "build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ty.environment]
python = "./.venv"
