[project]
name = "firstlook"
version = "2.0.0"
description = "Investigate your data and preserve an understanding you can explain."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 110
exclude = [".venv", ".git", ".agents/skills", "scratch", "dist", "build", "archive"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ty.environment]
python = "./.venv"
